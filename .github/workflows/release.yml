name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-build-qualify-release:
    name: Validate, build, qualify, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PROBEOS_QEMU_ACCEL: tcg
      PROBEOS_QEMU_TIMEOUT: 600
      PROBEOS_MEMTEST_TIMEOUT: 180
      PROBEOS_LAN_TIMEOUT: 600
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate SemVer release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Install validation and qualification tools
        run: sudo apt-get update && sudo apt-get install -y curl jq ovmf qemu-system-x86 shellcheck xorriso
      - name: Report QEMU acceleration
        run: |
          test ! -e /dev/kvm || ls -l /dev/kvm
          echo "QEMU acceleration: $PROBEOS_QEMU_ACCEL (software emulation forced)"
      - name: Run validation suite
        run: ci/validate.sh
      - name: Build normal artifacts
        run: ci/build-all.sh
      - name: Run required qualification
        run: ci/qualify.sh
      - name: Generate and verify tagged release metadata
        run: ci/generate-release-metadata.sh
      - name: Select reviewed release notes
        run: |
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Create GitHub Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$version" \
            '.manifest_version==1 and .git_commit==$sha and .probeos_version==$version and
             .build_channel=="release" and (.artifacts|length)==4' \
            out/release-manifest.json >/dev/null
          gh release create "$GITHUB_REF_NAME" \
            "out/probeos-$version-x86_64-grub.iso" \
            "out/probeos-$version-x86_64-syslinux.iso" \
            "out/probeos-$version-x86-grub.iso" \
            "out/probeos-$version-x86-syslinux.iso" \
            out/SHA256SUMS out/release-manifest.json \
            --verify-tag --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "ProbeOS $GITHUB_REF_NAME"
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: probeos-release-failure-logs-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
